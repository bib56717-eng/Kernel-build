name: Build LineageOS 22.2 Vendor (daisy)

on:
  workflow_dispatch:

jobs:
  build-vendor:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup build directory on /mnt
        run: |
          sudo mkdir -p /mnt/lineage
          sudo chown -R $USER:$USER /mnt/lineage
          df -h

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python-is-python3 repo
          git lfs install

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize LineageOS 22.2 source
        run: |
          cd /mnt/lineage
          yes | repo init -u https://github.com/LineageOS/android.git -b lineage-22.2 --depth=1 --git-lfs --no-clone-bundle 

      - name: Create local manifest for daisy
        run: |
          mkdir -p /mnt/lineage/.repo/local_manifests
          cat << 'EOF' > /mnt/lineage/.repo/local_manifests/daisy.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="ximi" fetch="https://github.com" />
            <remote name="bib" fetch="https://github.com" />

            <!-- Device trees -->
            <project path="device/xiaomi/daisy" name="android_device_xiaomi_daisy" remote="ximi" revision="lineage-22.2" />
            <project path="device/xiaomi/msm8953-common" name="android_device_xiaomi_msm8953-common" remote="ximi" revision="lineage-22.2" />

            <!-- Kernel -->
            <project path="kernel/xiaomi/msm8953" name="android_kernel_xiaomi_msm8953" remote="ximi" revision="lineage-22.2-base" />

            <!-- Hardware -->
            <project path="hardware/xiaomi" name="LineageOS/android_hardware_xiaomi" remote="github" revision="lineage-22.2" />

            <!-- Vendor blobs -->
            <project path="vendor/xiaomi/daisy" name="proprietary_vendor_xiaomi_daisy" remote="ximi" revision="lineage-22.2" />
            <project path="vendor/xiaomi/msm8953-common" name="proprietary_vendor_xiaomi_msm8953-common" remote="bib" revision="lineage-22.2" />
          </manifest>
          EOF

      - name: Sync repositories & clean git objects
        run: |
          cd /mnt/lineage
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          rm -rf .repo
          df -h

      - name: Build vendor.img
        run: |
          cd /mnt/lineage
          source build/envsetup.sh
          lunch lineage_daisy-bp1a-userdebug || breakfast daisy
          m vendorimage

      - name: Upload vendor.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-daisy-lineage22.2
          path: /mnt/lineage/out/target/product/daisy/vendor.img
