name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build MT6757 Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            cpio \
            rsync \
            zstd \
            lz4 \
            make \
            gcc \
            g++

      - name: Install Python 2.7.18
        shell: bash
        run: |
          set -e

          git clone --depth=1 https://github.com/pyenv/pyenv.git "$HOME/.pyenv"

          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"

          eval "$(pyenv init -)"

          pyenv install 2.7.18
          pyenv global 2.7.18

          PYTHON2="$HOME/.pyenv/versions/2.7.18/bin"

          echo "$PYTHON2" >> "$GITHUB_PATH"

          echo "PYENV_ROOT=$PYENV_ROOT" >> "$GITHUB_ENV"
          echo "PYTHON2=$PYTHON2/python" >> "$GITHUB_ENV"

          "$PYTHON2/python" --version

          if [ -f "$PYTHON2/python2" ]; then
            "$PYTHON2/python2" --version
          fi

      - name: Set Python 2 as default
        shell: bash
        run: |
          set -e

          PYTHON_BIN="$HOME/.pyenv/versions/2.7.18/bin"

          sudo ln -sf "$PYTHON_BIN/python2.7" /usr/local/bin/python
          sudo ln -sf "$PYTHON_BIN/python2.7" /usr/local/bin/python2
          sudo ln -sf "$PYTHON_BIN/python2.7" /usr/local/bin/python2.7

          hash -r

          echo "Python:"
          python --version

          echo "Python2:"
          python2 --version

          echo "Python path:"
          which python
          which python2

          python -c "import sys; print(sys.version)"
          python2 -c "print 'Python 2 works'"

      - name: Clone kernel
        run: |
          git clone \
            --depth=1 \
            -b master \
            https://github.com/bib56717-eng/android_kernel_mediatek_mt6757CD-4.4.git \
            kernel

      - name: Download AOSP GCC
        run: |
          mkdir -p toolchain

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain/aarch64-linux-android-4.9

      - name: Download AOSP Clang
        run: |
          mkdir -p toolchain

          git clone \
            --depth=1 \
            -b android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchain/clang

      - name: Verify build environment
        run: |
          echo "Python:"
          python --version
          which python

          echo "Python2:"
          python2 --version
          which python2

          echo "GCC:"
          gcc --version | head -n 1

          echo "Make:"
          make --version | head -n 1

      
      - name: Configure kernel
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/clang-r383902/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "Python used by kernel:"
          python --version
          which python

          make O=out ARCH=arm64 k57pv1_dm_64_defconfig

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/clang-r383902/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "Python used by DrvGen:"
          python --version
          which python

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android-

      - name: Check kernel
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "Kernel output:"
          ls -lah out/arch/arm64/boot/

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb found"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz found"
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "Image found"
          else
            echo "Kernel image not found!"
            exit 1
          fi

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: MT6757-kernel
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dts/
