name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build MT6757 Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            cpio \
            rsync \
            python3 \
            python3-pip \
            zstd \
            lz4

      - name: Install Python 2.7
        run: |
          git clone https://github.com/pyenv/pyenv.git "$HOME/.pyenv"

          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"

          eval "$(pyenv init -)"

          pyenv install 2.7.18
          pyenv global 2.7.18

          python --version
          python2 --version

          echo "$PYENV_ROOT/bin" >> "$GITHUB_PATH"

      - name: Clone kernel
        run: |
          git clone \
            --depth=1 \
            -b lineage-15.1 \
            https://github.com/LCM-MTK/android_kernel_mediatek_mt6757.git \
            kernel

      - name: Download AOSP GCC
        run: |
          mkdir -p toolchain

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain/aarch64-linux-android-4.9

      - name: Download AOSP Clang
        run: |
          mkdir -p toolchain

          git clone \
            --depth=1 \
            -b android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchain/clang

      - name: Configure kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/clang-r383902/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          python --version

          make O=out ARCH=arm64 k57pv1_dm_64_defconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/clang-r383902/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android-

      - name: Check kernel
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb found"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz found"
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "Image found"
          else
            echo "Kernel image not found!"
            exit 1
          fi

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: MT6757-kernel
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dts/
